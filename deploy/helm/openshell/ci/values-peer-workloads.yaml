# E2E overlay: accept caller-supplied Kubernetes driver config so sandboxes can
# request peer workload containers (containers.workloads). Resource admission
# stays enabled; peer workloads use Memory emptyDir volumes only.
gatewayConfig:
  openshell.drivers.kubernetes:
    allow_driver_config: true
