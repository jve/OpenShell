name: Niuu Dev Images

on:
  push:
    branches: [codex/niuu-multi-container-sandboxes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niuu-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'jve/OpenShell'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      MISE_GITHUB_TOKEN: ${{ github.token }}
      PREBUILT_ARCH: ${{ matrix.arch }}
      IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
      IMAGE_REGISTRY: ghcr.io/jve/openshell
      OPENSHELL_AUDITABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang lld pkg-config libssl-dev musl-tools
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: niuu-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build gateway and static supervisor
        run: mise run build:docker:prebuilt
      - name: Build local images
        run: mise run build:docker:gateway build:docker:supervisor
      - name: Build test clients
        run: mise exec -- cargo build -p openshell-cli -p openshell-conformance-cli
      - name: Create acceptance cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: niuu-acceptance
          wait: 120s
      - name: Load candidate images
        run: |
          kind load docker-image --name niuu-acceptance \
            "${IMAGE_REGISTRY}/gateway:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/supervisor:${IMAGE_TAG}"
          kind get kubeconfig --name niuu-acceptance > kubeconfig
      - name: Verify multi-container localhost and egress enforcement
        env:
          OPENSHELL_BIN: ${{ github.workspace }}/target/debug/openshell
          OPENSHELL_CONFORMANCE_BIN: ${{ github.workspace }}/target/debug/openshell-conformance
          OPENSHELL_E2E_KUBE_CONTEXT: kind-niuu-acceptance
          OPENSHELL_E2E_KUBE_BUILD_IMAGES: "0"
          OPENSHELL_REGISTRY: ghcr.io/jve/openshell
          OPENSHELL_E2E_KUBE_TEST: kubernetes_workload_containers
          OPENSHELL_E2E_KUBE_EXTRA_VALUES: deploy/helm/openshell/ci/values-sidecar.yaml
        run: mise run e2e:kubernetes
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested architecture with provenance and SBOM
        env:
          DOCKER_PUSH: "1"
        run: mise run build:docker:gateway build:docker:supervisor
      - name: Remove acceptance cluster
        if: always()
        run: kind delete cluster --name niuu-acceptance

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/jve/openshell
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture image indexes
        run: |
          for component in gateway supervisor; do
            docker buildx imagetools create --prefer-index=false \
              --tag "${REGISTRY}/${component}:${REVISION}" \
              "${REGISTRY}/${component}:${REVISION}-amd64" \
              "${REGISTRY}/${component}:${REVISION}-arm64"
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish matching immutable chart
        run: |
          cp -a deploy/helm/openshell "${RUNNER_TEMP}/openshell-chart"
          chart="${RUNNER_TEMP}/openshell-chart"
          sed -i "s/^version:.*/version: 0.0.0-niuu.sha${REVISION}/" "${chart}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${REVISION}\"/" "${chart}/Chart.yaml"
          sed -i "s|ghcr.io/nvidia/openshell/gateway|${REGISTRY}/gateway|g; s|ghcr.io/nvidia/openshell/supervisor|${REGISTRY}/supervisor|g" "${chart}/values.yaml"
          helm lint "${chart}"
          helm package "${chart}" --destination "${RUNNER_TEMP}/charts"
          helm push "${RUNNER_TEMP}/charts/helm-chart-0.0.0-niuu.sha${REVISION}.tgz" "oci://${REGISTRY}"
          {
            echo "Gateway and supervisor: ${REGISTRY}/{gateway,supervisor}:${REVISION}"
            echo "Chart: oci://${REGISTRY}/helm-chart:0.0.0-niuu.sha${REVISION}"
            echo "Both architectures passed the multi-container Kubernetes acceptance test."
          } >> "$GITHUB_STEP_SUMMARY"
